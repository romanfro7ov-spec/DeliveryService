<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DeliveryService — служба доставки</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">D</span><span>Delivery<span class="brand-light">Service</span></span></div>
    <div class="role-caption">РАБОЧЕЕ ПРОСТРАНСТВО</div>
    <nav id="mainNav">
      <button class="nav-link active" data-page="dashboard"><span>▦</span> Обзор</button>
      <button class="nav-link" data-page="orders"><span>▤</span> Заказы</button>
      <button class="nav-link" data-page="create"><span>＋</span> Новый заказ</button>
      <button class="nav-link" data-page="profile"><span>○</span> Профиль</button>
    </nav>
    <div class="sidebar-bottom">
      <div class="online-dot"></div><span>Система работает</span>
      <small>Демонстрационный режим</small>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div><div class="eyebrow">DELIVERYSERVICE / ЛИЧНЫЙ КАБИНЕТ</div><h1 id="pageTitle">Обзор</h1></div>
      <div class="top-actions">
        <label class="role-switch">Роль
          <select id="roleSelect">
            <option value="customer">Заказчик</option>
            <option value="courier">Курьер</option>
            <option value="admin">Администратор</option>
          </select>
        </label>
        <div class="avatar" id="avatar">З</div>
      </div>
    </header>
    <section id="view" class="view"></section>
    <footer>© 2026 DeliveryService <span>Учебный демонстрационный проект</span></footer>
  </main>
</div>
<div id="toast" class="toast" role="status"></div>
<dialog id="orderDialog">
  <form id="orderForm" method="dialog" class="dialog-card">
    <button type="button" class="dialog-close" id="closeDialog">×</button>
    <div class="eyebrow">НОВАЯ ЗАЯВКА</div><h2>Оформление заказа</h2>
    <label>Имя заказчика<input name="customer" required placeholder="Например, Иван"></label>
    <label>Телефон<input name="phone" required placeholder="+7 900 000-00-00"></label>
    <label>Адрес доставки<input name="address" required placeholder="Улица, дом, квартира"></label>
    <label>Состав заказа<textarea name="items" required placeholder="Например: обед №1, напиток"></textarea></label>
    <label>Комментарий<textarea name="comment" placeholder="Домофон, пожелания..."></textarea></label>
    <div class="dialog-actions"><button type="button" class="btn btn-ghost" id="cancelDialog">Отмена</button><button class="btn btn-primary" type="submit">Создать заказ</button></div>
  </form>
</dialog>
<script src="js/app.js"></script>
</body>
</html>
